<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7ff">
    <title>ثبت‌نام در دوره آکادمی آفاق</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <section class="form-card" aria-labelledby="registration-title">
            <p class="motto">قدم بزرگ برای یادگیری بهتر </p>
            <h1 id="registration-title">ثبت‌نام در دوره</h1>
            <p class="intro">مشخصاتت رو وارد کن تا برای شرکت در کلاس آنلاین بهت زنگ بزنیم.</p>

            <form action="#" method="get">
                <div class="field">
                    <label for="full-name">نام کامل</label>
                    <input id="full-name" name="fullName" type="text" autocomplete="name" placeholder="مثلاً نگار عزیزی " required>
                </div>

                <div class="field">
                    <label for="email">ایمیل</label>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" dir="ltr" required>
                </div>

                <div class="field">
                    <label for="mobile">شماره موبایل</label>
                    <input id="mobile" name="mobile" type="tel" autocomplete="tel" inputmode="numeric" pattern="09[0-9]{9}" placeholder="09123456789" dir="ltr" title="شماره موبایل را با 09 و ۹ رقم دیگر وارد کنید.">
                    <p class="hint">شماره را با 09 و بدون فاصله وارد کنید.</p>
                </div>

                <button type="submit">اتمام ثبت‌ نام</button>
            </form>
        </section>
    </main>

    <footer>© تمام حقوق برای آکادمی آفاق محفوظ است. </footer>
</body>
</html>
